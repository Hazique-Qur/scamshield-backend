services:
  - type: web
    name: scamshield-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./scamshield.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: STORAGE_DIR
        value: ./storage
      - key: MAX_UPLOAD_SIZE
        value: 10485760
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
    disk:
      name: scamshield-data
      mountPath: /opt/render/project/src/scamshield.db
      sizeGB: 1
