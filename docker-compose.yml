version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./scamshield.db:/app/scamshield.db
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///./scamshield.db
      - SECRET_KEY=your-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=your-gemini-api-key
      - CORS_ORIGINS=*
    restart: unless-stopped
